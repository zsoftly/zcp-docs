name: '40: Prune Images'

# Docs: platform docs/deployments/web-deployments.md

on:
  schedule:
    - cron: '17 6 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be deleted and delete nothing
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: prune-images
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prune:
    name: Prune old images
    runs-on: zsoftly-yow
    timeout-minutes: 15
    steps:
      - name: '00: Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: '01: Token to read the pinned digests'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liurfYWGw6qod4l1
          private-key: ${{ secrets.ZSOFTLY_CI_READ_APP_PRIVATE_KEY }}
          owner: zsoftly
          repositories: gitops-apps
          permission-contents: read

      - name: '02: Checkout gitops-apps'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zsoftly/gitops-apps
          token: ${{ steps.app-token.outputs.token }}
          path: gitops-apps
          persist-credentials: false

      - name: '03: Collect the pinned digests'
        run: |
          grep -rhoE --exclude-dir=.git 'sha256:[0-9a-f]{64}' gitops-apps | sort -u > "$RUNNER_TEMP/pinned-digests.txt"
          echo "[INFO] $(wc -l < "$RUNNER_TEMP/pinned-digests.txt" | tr -d ' ') digests are pinned in gitops-apps"

      - name: '04: Prune'
        env:
          ORG: zsoftly
          PACKAGE: zcp-docs
          GH_TOKEN: ${{ github.token }}
          PINNED_FILE: ${{ runner.temp }}/pinned-digests.txt
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: .github/scripts/prune-images.sh
