name: '40: Deploy Production'

# Manual production deploy for docs.zcp.zsoftly.ca.
# This workflow is the app repo entry point. It fetches the shared iaas
# deployment script, builds on a clean hosted runner, then deploys on YOW.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Release branch validated in stg (e.g. release/2026-08-05-1400)'
        required: true
        type: string
concurrency:
  group: deploy-prod-docs
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build production artifact
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.resolve_source.outputs.source_sha }}
      iaas_sha: ${{ steps.fetch_iaas.outputs.iaas_sha }}
    steps:
      - name: '00: Validate inputs'
        env:
          GIT_REF: ${{ github.ref }}
          SOURCE_REF: ${{ github.event.inputs.source_ref }}
        run: |
          if [ "$GIT_REF" != "refs/heads/main" ]; then
            echo "[ERROR] Production deploy workflow must be dispatched from main (got: $GIT_REF)"
            exit 1
          fi
          if [[ "$SOURCE_REF" != release/* ]]; then
            echo "[ERROR] source_ref must start with release/ (got: $SOURCE_REF)"
            exit 1
          fi
          if ! git check-ref-format --branch "$SOURCE_REF" >/dev/null 2>&1; then
            echo "[ERROR] source_ref must be a valid branch name (got: $SOURCE_REF)"
            exit 1
          fi
          echo "[OK] workflow ref=$GIT_REF"
          echo "[OK] source_ref=$SOURCE_REF"

      - name: '01: Fetch shared iaas deployment logic'
        id: fetch_iaas
        env:
          IAAS_REF: main
          IAAS_REPO_READ_TOKEN: ${{ secrets.IAAS_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          IAAS_DIR="${RUNNER_TEMP}/zcp-prod-iaas-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export IAAS_DIR
          if [ -z "$IAAS_REPO_READ_TOKEN" ]; then
            echo "[ERROR] IAAS_REPO_READ_TOKEN is required"
            exit 1
          fi

          SECRET_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/iaas-fetch.XXXXXX")"
          chmod 700 "$SECRET_DIR"
          TOKEN_FILE="$SECRET_DIR/github-token"
          ASKPASS_FILE="$SECRET_DIR/git-askpass"
          printf '%s' "$IAAS_REPO_READ_TOKEN" > "$TOKEN_FILE"
          chmod 600 "$TOKEN_FILE"
          cat > "$ASKPASS_FILE" <<'ASKPASS'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf "%s\n" "x-access-token" ;;
            *Password*) cat "$GIT_TOKEN_FILE" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$ASKPASS_FILE"
          trap 'rm -rf "$SECRET_DIR"' EXIT
          unset IAAS_REPO_READ_TOKEN

          mkdir -p "$(dirname "$IAAS_DIR")"
          rm -rf "$IAAS_DIR"
          GIT_TOKEN_FILE="$TOKEN_FILE" GIT_ASKPASS="$ASKPASS_FILE" GIT_TERMINAL_PROMPT=0 \
            git clone --no-tags https://github.com/zsoftly/iaas.git "$IAAS_DIR"
          GIT_TOKEN_FILE="$TOKEN_FILE" GIT_ASKPASS="$ASKPASS_FILE" GIT_TERMINAL_PROMPT=0 \
          git -C "$IAAS_DIR" fetch --force --prune origin "refs/heads/${IAAS_REF}:refs/remotes/origin/${IAAS_REF}"
          git -C "$IAAS_DIR" checkout --force --detach "refs/remotes/origin/${IAAS_REF}"
          git -C "$IAAS_DIR" clean -ffdx
          IAAS_SHA="$(git -C "$IAAS_DIR" rev-parse HEAD)"
          echo "iaas_sha=$IAAS_SHA" >> "$GITHUB_OUTPUT"
          echo "[OK] iaas_sha=$IAAS_SHA"
          DEPLOY_SCRIPT="${RUNNER_TEMP}/deploy-zcp-website-prod.sh"
          cp "$IAAS_DIR/.github/scripts/deploy-zcp-website-prod.sh" "$DEPLOY_SCRIPT"
          chmod 700 "$DEPLOY_SCRIPT"
          rm -rf "$IAAS_DIR"
          echo "DEPLOY_SCRIPT=$DEPLOY_SCRIPT" >> "$GITHUB_ENV"

      - name: '02: Prepare source checkout'
        env:
          PHASE: prepare
          SITE: docs
          SOURCE_REPO: zsoftly/zcp-docs
          SOURCE_REF: ${{ github.event.inputs.source_ref }}
          SOURCE_REPO_TOKEN: ${{ github.token }}
        run: |
          "$DEPLOY_SCRIPT"

      - name: '03: Record resolved source commit'
        id: resolve_source
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git -C "$HOME/zsoftly/zcp-docs" rev-parse HEAD)"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "[OK] source_sha=$SOURCE_SHA"

      - name: '04: Setup pnpm'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - name: '05: Setup Node.js'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: '06: Build selected release'
        env:
          PHASE: build
          SITE: docs
        run: |
          "$DEPLOY_SCRIPT"

      - name: '07: Stage production artifact'
        run: |
          set -euo pipefail
          ARTIFACT_DIR="${RUNNER_TEMP}/docs-site-dist"
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"
          cp -a "$HOME/zsoftly/zcp-docs/dist/." "$ARTIFACT_DIR/"

      - name: '08: Upload production artifact'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-site-dist
          path: ${{ runner.temp }}/docs-site-dist
          if-no-files-found: error

  deploy:
    name: Deploy production
    needs: build
    runs-on: zsoftly-yow
    environment:
      name: production
      url: https://docs.zcp.zsoftly.ca
    steps:
      - name: '00: Fetch trusted iaas deployment logic'
        env:
          IAAS_SHA: ${{ needs.build.outputs.iaas_sha }}
          IAAS_REPO_READ_TOKEN: ${{ secrets.IAAS_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          IAAS_DIR="${RUNNER_TEMP}/zcp-prod-iaas-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export IAAS_DIR
          if [ -z "$IAAS_SHA" ]; then
            echo "[ERROR] Build job did not provide iaas_sha"
            exit 1
          fi
          if [[ ! "$IAAS_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "[ERROR] iaas_sha must be a 40-character commit SHA (got: $IAAS_SHA)"
            exit 1
          fi
          if [ -z "$IAAS_REPO_READ_TOKEN" ]; then
            echo "[ERROR] IAAS_REPO_READ_TOKEN is required"
            exit 1
          fi

          SECRET_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/iaas-fetch.XXXXXX")"
          chmod 700 "$SECRET_DIR"
          TOKEN_FILE="$SECRET_DIR/github-token"
          ASKPASS_FILE="$SECRET_DIR/git-askpass"
          printf '%s' "$IAAS_REPO_READ_TOKEN" > "$TOKEN_FILE"
          chmod 600 "$TOKEN_FILE"
          cat > "$ASKPASS_FILE" <<'ASKPASS'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf "%s\n" "x-access-token" ;;
            *Password*) cat "$GIT_TOKEN_FILE" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$ASKPASS_FILE"
          trap 'rm -rf "$SECRET_DIR"' EXIT
          unset IAAS_REPO_READ_TOKEN

          mkdir -p "$(dirname "$IAAS_DIR")"
          rm -rf "$IAAS_DIR"
          GIT_TOKEN_FILE="$TOKEN_FILE" GIT_ASKPASS="$ASKPASS_FILE" GIT_TERMINAL_PROMPT=0 \
            git clone --no-tags https://github.com/zsoftly/iaas.git "$IAAS_DIR"
          GIT_TOKEN_FILE="$TOKEN_FILE" GIT_ASKPASS="$ASKPASS_FILE" GIT_TERMINAL_PROMPT=0 \
            git -C "$IAAS_DIR" fetch --force --prune origin "$IAAS_SHA"
          git -C "$IAAS_DIR" checkout --force --detach "$IAAS_SHA"
          git -C "$IAAS_DIR" clean -ffdx

      - name: '01: Prepare source checkout'
        env:
          PHASE: prepare
          SITE: docs
          SOURCE_REPO: zsoftly/zcp-docs
          SOURCE_REF: ${{ github.event.inputs.source_ref }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          SOURCE_REPO_TOKEN: ${{ github.token }}
        run: |
          IAAS_DIR="${RUNNER_TEMP}/zcp-prod-iaas-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export IAAS_DIR
          "$IAAS_DIR/.github/scripts/deploy-zcp-website-prod.sh"

      - name: '02: Download production artifact'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docs-site-dist
          path: ${{ runner.temp }}/docs-site-dist

      - name: '03: Install production artifact'
        run: |
          set -euo pipefail
          DIST_DIR="$HOME/zsoftly/zcp-docs/dist"
          rm -rf "$DIST_DIR"
          mkdir -p "$DIST_DIR"
          cp -a "${RUNNER_TEMP}/docs-site-dist/." "$DIST_DIR/"

      - name: '04: Dry run production deploy'
        env:
          PHASE: dry_run
          SITE: docs
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          ANSIBLE_SSH_KEY: ${{ secrets.ANSIBLE_SSH_KEY }}
        run: |
          IAAS_DIR="${RUNNER_TEMP}/zcp-prod-iaas-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export IAAS_DIR
          "$IAAS_DIR/.github/scripts/deploy-zcp-website-prod.sh"

      - name: '05: Deploy production'
        env:
          PHASE: deploy
          SITE: docs
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          ANSIBLE_SSH_KEY: ${{ secrets.ANSIBLE_SSH_KEY }}
        run: |
          IAAS_DIR="${RUNNER_TEMP}/zcp-prod-iaas-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export IAAS_DIR
          "$IAAS_DIR/.github/scripts/deploy-zcp-website-prod.sh"

      - name: '06: Smoke production'
        env:
          PHASE: smoke
          SITE: docs
        run: |
          IAAS_DIR="${RUNNER_TEMP}/zcp-prod-iaas-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export IAAS_DIR
          "$IAAS_DIR/.github/scripts/deploy-zcp-website-prod.sh"
