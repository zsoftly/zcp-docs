name: '00: CI'

# Runs on every PR and is callable from deploy workflows via workflow_call.
# Public repo — uses GitHub-hosted runners (no limits).

on:
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
      - 'README.md'
      - '.vscode/**'
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege — these jobs only read the repo to lint/typecheck/audit/build.
permissions:
  contents: read

env:
  # Opt JS actions (pnpm/action-setup) into Node 24 ahead of the June 2026 default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: '00: Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: '01: Setup Node.js'
        uses: ./.github/actions/setup-node

      - name: '02: Check formatting'
        run: pnpm fmt:check

      - name: '03: Run ESLint'
        run: pnpm lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: '00: Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: '01: Setup Node.js'
        uses: ./.github/actions/setup-node

      - name: '02: Run type check'
        run: pnpm typecheck

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: '00: Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: '01: Setup Node.js'
        uses: ./.github/actions/setup-node

      - name: '02: Run dependency audit'
        run: pnpm audit --audit-level=high

  build:
    name: Build
    needs: [lint, typecheck, security-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: '00: Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: '01: Setup Node.js'
        uses: ./.github/actions/setup-node

      - name: '02: Install Chromium for Playwright (build-time Mermaid SVG)'
        run: pnpm exec playwright install --with-deps chromium

      - name: '03: Test AI-readable Markdown exporter'
        run: pnpm test:ai-readable

      - name: '04: Test reported internal links'
        run: pnpm test:reported-links

      - name: '05: Test OneUptime notice integration'
        run: pnpm test:oneuptime-notices

      - name: '06: Build'
        run: pnpm build

      - name: '07: Verify build output'
        run: |
          if [ ! -d "dist" ]; then
            echo "[FAIL] Build output not found at dist/"
            exit 1
          fi
          FILE_COUNT=$(find dist -type f | wc -l)
          echo "[OK] Build output verified: $FILE_COUNT files"
          if [ "$FILE_COUNT" -lt 50 ]; then
            echo "[FAIL] Expected at least 50 files in dist/, got $FILE_COUNT"
            exit 1
          fi

      - name: '08: Verify sitemap host'
        # No PUBLIC_SITE_URL is set here, so the build must resolve to the
        # canonical host from astro.config.mjs.
        run: .github/scripts/verify-sitemap.sh https://docs.zcp.zsoftly.ca

      - name: '09: Verify robots host'
        run: bash .github/scripts/verify-robots.sh https://docs.zcp.zsoftly.ca

      - name: '10: Upload build artifact on failure'
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-failure-logs
          path: dist/
          retention-days: 3
          if-no-files-found: ignore
          compression-level: 9
