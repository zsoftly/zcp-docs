name: '10: Deploy Dev'

# Auto-deploys to dev on every push to main after CI passes.
# Deploy runs on zsoftly-yow (self-hosted, VPN-reachable) — builds the site
# and ships it to the dev/stg Caddy box via deploy/scripts/deploy-web.sh
# (release-symlink swap).
# A separate job then pushes the same build as a container image.

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
      - 'README.md'
      - '.vscode/**'

concurrency:
  group: deploy-dev
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/00-ci.yml
    secrets: inherit

  deploy:
    name: Deploy to Dev
    needs: [ci]
    runs-on: zsoftly-yow
    environment: dev
    steps:
      - name: '00: Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: '01: Setup Node.js'
        uses: ./.github/actions/setup-node

      - name: '02: Install Chromium for Playwright (build-time Mermaid SVG)'
        run: pnpm exec playwright install chromium

      - name: '03: Build'
        env:
          PUBLIC_SITE_URL: https://dev-docs.zcp.zsoftly.ca
        run: pnpm build

      - name: '04: Verify sitemap host'
        run: .github/scripts/verify-sitemap.sh https://dev-docs.zcp.zsoftly.ca

      - name: '05: Verify robots host'
        run: bash .github/scripts/verify-robots.sh https://dev-docs.zcp.zsoftly.ca

      - name: '06: Package release artifact'
        run: tar -czf "$RUNNER_TEMP/zcp-docs-dev.tar.gz" -C dist .

      - name: '06b: Keep the artifact for the image job'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zcp-docs-dev
          path: ${{ runner.temp }}/zcp-docs-dev.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: '07: Deploy release'
        uses: ./.github/actions/deploy-release
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          deploy-host: ${{ secrets.DEV_DEPLOY_HOST }}
          site-root: /var/www/zcp-docs-dev
          releases-dir: /var/releases/zcp-docs-dev
          artifact-path: ${{ runner.temp }}/zcp-docs-dev.tar.gz

      - name: '08: Smoke test live site'
        run: .github/scripts/smoke-test.sh dev-docs.zcp.zsoftly.ca

  # The image feeds the K3s cluster on the dev sites VM (zcp-website #202).
  # It is its own job so a registry problem never fails the Compose deploy.
  image:
    name: Push dev image
    needs: [deploy]
    runs-on: zsoftly-yow
    permissions:
      contents: read
      packages: write
    steps:
      - name: '00: Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: '01: Fetch the built site'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zcp-docs-dev
          path: ${{ runner.temp }}/site-artifact

      - name: '02: Build and push the image'
        uses: ./.github/actions/push-image
        with:
          image: ghcr.io/zsoftly/zcp-docs
          tag: dev-${{ github.sha }}
          artifact-path: ${{ runner.temp }}/site-artifact/zcp-docs-dev.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
