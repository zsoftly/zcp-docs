name: '10: Deploy Dev'

# Runs after every push to main: full CI, then the container image that
# zsoftly/gitops-apps pins for dev, stg and prd. Dev is served by K3s since
# 2026-11-14 (zsoftly/zcp-website#202).

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
      - 'README.md'
      - '.vscode/**'

concurrency:
  group: deploy-dev
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/00-ci.yml
    secrets: inherit

  # The image is the checked CI build with the prd site URL. GitOps promotes the
  # same digest from dev to stg and prd (zcp-website #202). It does not wait for
  # the Compose deploy, and a registry problem never fails that deploy.
  image:
    name: Push image
    needs: [ci]
    runs-on: zsoftly-yow
    permissions:
      contents: read
      packages: write
    steps:
      - name: '00: Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: '01: Fetch the checked release build'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zcp-docs-release
          path: ${{ runner.temp }}/site-artifact

      - name: '02: Build and push the image'
        uses: ./.github/actions/push-image
        with:
          image: ghcr.io/zsoftly/zcp-docs
          tag: sha-${{ github.sha }}
          artifact-path: ${{ runner.temp }}/site-artifact/zcp-docs-release.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
