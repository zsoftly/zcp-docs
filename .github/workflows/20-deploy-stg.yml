name: '20: Deploy Staging'

# Manual deploy to staging from a release branch.
# Deploy runs on zsoftly-yow (self-hosted, VPN-reachable) — builds the site
# and ships it to the dev/stg Caddy box via deploy/scripts/deploy-web.sh
# (release-symlink swap).

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Release branch to deploy (e.g. release/2026-06-01-1400)'
        required: true
        type: string

concurrency:
  group: deploy-stg
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate
    runs-on: zsoftly-yow
    steps:
      - name: '00: Validate branch name'
        env:
          BRANCH: ${{ github.event.inputs.branch }}
        run: |
          if [[ "$BRANCH" != release/* ]]; then
            echo "[ERROR] Branch must start with 'release/' (got: $BRANCH)"
            exit 1
          fi
          echo "[OK] Branch validated: $BRANCH"

  ci:
    name: CI
    needs: [validate]
    uses: ./.github/workflows/00-ci.yml
    secrets: inherit

  deploy:
    name: Deploy to Staging
    needs: [ci]
    runs-on: zsoftly-yow
    environment: stg
    steps:
      - name: '00: Checkout'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}
          persist-credentials: false

      - name: '01: Setup Node.js'
        uses: ./.github/actions/setup-node

      - name: '02: Install Chromium for Playwright (build-time Mermaid SVG)'
        run: pnpm exec playwright install --with-deps chromium

      - name: '03: Build'
        env:
          PUBLIC_SITE_URL: https://stg-docs.zcp.zsoftly.ca
        run: pnpm build

      - name: '04: Package release artifact'
        run: tar -czf "$RUNNER_TEMP/zcp-docs-stg.tar.gz" -C dist .

      - name: '05: Deploy release'
        uses: ./.github/actions/deploy-release
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          deploy-host: ${{ secrets.STG_DEPLOY_HOST }}
          site-root: /var/www/zcp-docs-stg
          releases-dir: /var/releases/zcp-docs-stg
          artifact-path: ${{ runner.temp }}/zcp-docs-stg.tar.gz

      - name: '06: Smoke test live site'
        run: .github/scripts/smoke-test.sh stg-docs.zcp.zsoftly.ca
